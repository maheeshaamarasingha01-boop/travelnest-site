<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- FAVICON -->
    <link rel="icon" href="images/icon.png">

    <!-- MANIFEST -->
    <link rel="manifest" href="manifest.json">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">TravelNest</div>

    <div class="menu-toggle" onclick="toggleMenu()">
      ☰
    </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="destinations.html">Explore</a></li>
            <li><a href="budget.html">Budget</a></li>

        </ul>

    </nav>
</header>

<main>

    <div class="content-box">
        <h1>Random Trip Generator</h1>
        ...
    </div>

    <p>Let us choose your next adventure!</p>

    <section class="random-form">

        <label for="type">Travel Type</label>
        <select id="type">
            <option value="">Any</option>
            <option value="adventure">Adventure</option>
            <option value="relax">Relaxation</option>
            <option value="culture">Cultural</option>
            <option value="nature">Nature</option>
        </select>

        <label for="budget">Budget</label>
        <select id="budget">
            <option value="">Any</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <button onclick="generateTrip()">🎲 Generate Trip</button>

    </section>

    <div id="randomResult"></div>

</main>

<footer>
    <p>© 2026 TravelNest</p>
</footer>
