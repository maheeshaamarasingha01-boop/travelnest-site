<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelNest</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/icon.png">
    <link rel="manifest" href="manifest.json">
</head>


<body>

<!-- NAVBAR -->
<header>
    <nav class="navbar">
        <div class="logo">TravelNest</div>

        <ul class="nav-links">
            <li>index.htmlHome</a></li>
            <li>destinations.htmlExplore</a></li>
            <li>budget.htmlBudget</a></li>
            <li>random.htmlRandom</a></li>
            <li>mood.htmlMood</a></li>
            <li>feedback.htmlContact</a></li>
        </ul>

        <div class="hamburger">☰</div>
    </nav>
</header>

<!-- MAIN CONTENT -->
<main>

    <h1>Trip Budget Planner</h1>

    <section class="budget-form">

        <label for="destinationInput">Destination</label>
        <input type="text" id="destinationInput" placeholder="Enter destination">

        <label for="daysInput">Number of Days</label>
        <input type="number" id="daysInput" min="1" placeholder="Enter number of days">

        <label for="budgetInput">Daily Budget ($)</label>
        <input type="number" id="budgetInput" min="1" placeholder="Enter daily budget">

        <button onclick="calculateBudget()">Calculate</button>

    </section>

    <!-- RESULT -->
    <div id="resultBox"></div>

</main>

<!-- FOOTER -->
<footer>
    <p>© 2026 TravelNest</p>
</footer>

<!-- JS FILES -->
<script src="data/destinations.js"></script>
<script src="js/script.js"></script>

</body>
</html>
