<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations - TravelNest</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Favicon -->
    <link rel="icon" href="images/icon.png">

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
</head>

<body>

<!-- NAVBAR -->
<header>
    <nav class="nav-container">
        <div class="logo">TravelNest</div>

    <div class="menu-toggle" onclick="toggleMenu()">
      ☰
    </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="destinations.html">Explore</a></li>
            <li><a href="budget.html">Budget</a></li>
            <li><a href="random.html">Random</a></li>
            <li><a href="mood.html">Mood</a></li>
            <li><a href="feedback.html">Contact</a></li>
        </ul>

    </nav>
</header>

<!-- MAIN CONTENT -->
<main>

    <h1>Explore Destinations</h1>
    <p>Browse and explore your dream destinations</p>

    <!-- SEARCH + FILTER -->
    <div class="controls">
        <input 
            type="text" 
            id="search" 
            placeholder="Search by destination name..."
        >

        <select id="filter">
            <option value="">All Continents</option>
            <option value="Asia">Asia</option>
            <option value="Europe">Europe</option>
            <option value="Africa">Africa</option>
            <option value="North America">North America</option>
            <option value="Australia">Australia</option>

        </select>
    </div>

    <!-- CARDS -->
    <div id="cardContainer"></div>

    <!-- MODAL -->
    <div id="modal" class="modal">
        <div class="modal-content">

            <span id="closeModal" aria-label="Close Modal" role="button">
                &times;
            </span>

            <div id="modalDetails"></div>

        </div>
    </div>

</main>

<!-- FOOTER -->
<footer>
    <p>© 2026 TravelNest</p>
</footer>

<!-- JS FILES -->
<script src="data/destinations.js"></script>
<script src="js/script.js"></script>

</body>
</html>
